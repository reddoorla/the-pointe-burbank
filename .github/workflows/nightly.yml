name: nightly

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "Which Playwright tier to run"
        type: choice
        options:
          - test:nightly
          - test:e2e
          - test:scaffold
        default: test:nightly

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (${{ inputs.script || 'test:nightly' }})
        env:
          SCRIPT: ${{ inputs.script || 'test:nightly' }}
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm run "$SCRIPT" --reporter=github,html

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # A red nightly has no other reader: GitHub emails a failed scheduled run
      # only to whoever last edited the cron. Only the nightly list files it; a
      # manual scaffold or e2e dispatch is allowed to be red.
      - if: failure() && (inputs.script || 'test:nightly') == 'test:nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly Playwright failing"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The nightly tier (\`pnpm test:nightly\`) failed: $RUN_URL"
          fi
